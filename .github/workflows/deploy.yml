name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # TODO: 서버가 준비되면 아래 Secrets를 GitHub 저장소 Settings > Secrets and variables
      # > Actions 에 등록하세요: SERVER_HOST, SERVER_USER, SERVER_SSH_KEY
      # (SERVICE_KEY, DATABASE_URL 등 앱의 .env 값은 서버에 이미 배포되어 있어야 하며
      # 이 워크플로우가 건드리지 않습니다.)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/competitor-dashboard
            git pull origin main
            source .venv/bin/activate
            pip install -r requirements.txt
            alembic upgrade head
            sudo systemctl restart competitor-dashboard
